name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Formatting (Prettier)
        run: npm run format:check
      - name: Tests (skills, commands, installer)
        run: npm test
